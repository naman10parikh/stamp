<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">stamp --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: stamp [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">stamp — the compliance / enterprise-readiness employee. badge = the connection;</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">stamp = the program that decides we need it and proves it to the auditor.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -v, --version                     print the stamp version</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                        display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  audit [options] &lt;path&gt;            gap-scan a target app for SOC2-readiness →</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                                    control-mapped gap report (severity + fix)</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  sso-plan [options]                emit the enterprise-SSO program plan + the</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                                    badge handoff (mechanism → badge)</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  audit-log [options]               design the tamper-evident audit trail OR</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                                    check a config for the 4 properties</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  access-review [options]           run a UAR scoped to non-human + agent</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                                    identities; propose revokes, a human</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                                    approves</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  residency [options]               ask &quot;residency or sovereignty?&quot;; enumerate</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                                    whole-pipeline pinning + the BYOK/CMK lever</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  dsar [options]                    plan a DSAR (access|erasure): clock +</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                                    subprocessor routing + exemptions; a human</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                                    signs</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">  questionnaire [options] &lt;format&gt;  draft questionnaire answers from the KB;</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
